<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medsfood — Jajan Lucu, Bayar Jujur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcf7ea;--ink:#2d2a4a;--cd:#fff;--mut:#6e6a8a;--bl:#5b8def;--li:#b79cf0;--pk:#ffb7d5;--or:#ffb347;--mn:#bfeee0;--bad:#e5566d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16142b;--ink:#f4eefc;--cd:#221f3d;--mut:#aaa5cc;--bl:#8fb0ff;--li:#c9b4ff;--pk:#ff9ccb;--or:#ffc060;--mn:#2c5b50;--bad:#ff7f94}}
:root[data-theme="dark"]{--bg:#16142b;--ink:#f4eefc;--cd:#221f3d;--mut:#aaa5cc;--bl:#8fb0ff;--li:#c9b4ff;--pk:#ff9ccb;--or:#ffc060;--mn:#2c5b50;--bad:#ff7f94}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);background:var(--bg) radial-gradient(color-mix(in srgb,var(--li) 30%,transparent) 2px,transparent 2.6px) 0 0/26px 26px;font:500 16px/1.5 Fredoka,system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--ink)}
nav .w{display:flex;align-items:center;min-height:60px;gap:4px}
.logo{font:italic 700 28px "Playfair Display",Georgia,serif;color:var(--ink);background:none;border:0;cursor:pointer;margin-right:auto}.logo span{color:var(--or);font-style:normal;font-size:18px}
.ln{display:flex;gap:4px;align-items:center}.ln button,.ham{background:none;border:2.5px solid transparent;border-radius:99px;color:var(--ink);font:600 15px Fredoka,sans-serif;padding:6px 14px;cursor:pointer;min-height:44px}
.ln button:hover{background:var(--pk);color:#2d2a4a}.ln .on{border-color:var(--ink);background:var(--mn);color:var(--ink)}.ham{display:none;font-size:22px}
.cartb{position:relative}.cartb i{position:absolute;top:2px;right:0;background:var(--bl);color:#fff;border-radius:99px;font:700 10px/1 Fredoka;padding:3px 6px;font-style:normal}
@media(max-width:760px){.ham{display:block}.ln{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:8px 20px;border-bottom:3px solid var(--ink)}.ln.open{display:flex}}
.btn{background:var(--or);color:#2d2a4a;border:3px solid var(--ink);border-radius:99px;padding:10px 22px;font:600 17px Fredoka,sans-serif;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;transform:none}.btn.o{background:var(--cd);color:var(--ink)}
table .btn{padding:2px 12px;min-height:36px;box-shadow:0 3px 0 var(--ink);font-size:15px}
h1{font:700 clamp(36px,8vw,66px)/1.05 Fredoka,sans-serif;letter-spacing:-.01em;margin:.2em 0}h2{font:700 clamp(26px,5vw,40px)/1.1 Fredoka,sans-serif;margin:1.6em 0 .6em}h3{margin:6px 0 2px;font:700 22px Fredoka,sans-serif}
.hl{text-decoration:underline wavy var(--pk);text-decoration-thickness:5px;text-underline-offset:8px}
.c{text-align:center;justify-content:center}.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.price{font:700 20px Fredoka}.oos{color:var(--bad);font-weight:700}
.hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:36px 0 20px}@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero .row{justify-content:center}}
.tag{display:inline-block;background:var(--mn);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px;font-weight:600;font-size:14px;transform:rotate(-2deg)}
.sub{color:var(--mut);font-size:18px;max-width:520px}.sp{position:absolute;color:var(--or);font-size:24px;animation:tw 3s ease-in-out infinite;pointer-events:none}
.pols{display:flex;gap:18px;justify-content:center}.pol{width:min(31%,200px);background:var(--cd);border:3px solid var(--ink);border-radius:24px;padding:8px 8px 4px;box-shadow:0 6px 0 var(--ink);transform:rotate(var(--r));animation:fl 5s ease-in-out infinite}.pol:nth-child(even){animation-delay:-2.5s;margin-top:34px}.pol .cap{text-align:center;font-weight:600;font-size:14px;padding:4px 0}
.ph{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:26px 40px 26px 40px/40px 26px 40px 26px;overflow:hidden;cursor:pointer;background:var(--cd);-webkit-tap-highlight-color:transparent;outline-offset:3px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .real{clip-path:circle(0% at 50% 55%);transition:clip-path .7s cubic-bezier(.6,0,.2,1)}.ph.on .real{clip-path:circle(80% at 50% 55%)}
@media(hover:hover){.ph:hover .real{clip-path:circle(80% at 50% 55%)}}
.ratio{position:relative;aspect-ratio:16/9;background:#111;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);overflow:hidden}.ratio iframe,.ov{position:absolute;inset:0;width:100%;height:100%;border:0}.ov{display:grid;place-items:center;color:#ddd;text-align:center;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px}
.pc,.cd{background:var(--cd);border:3px solid var(--ink);border-radius:32px;box-shadow:0 7px 0 var(--ink);padding:16px;transition:transform .2s}.pc:hover{transform:translateY(-4px) rotate(-.6deg)}.pc .btn{margin-top:10px;width:100%}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;counter-reset:s}.steps div{background:var(--cd);border:3px solid var(--ink);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--ink)}.steps div::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pk);color:#2d2a4a;font-weight:700;margin-bottom:6px}
.banner{background:var(--or);color:#2d2a4a;border:3px solid var(--ink);border-radius:18px;padding:10px 16px;font-weight:600;font-size:14px;margin:14px 0}
input,select{font:500 16px Fredoka,sans-serif;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--cd);color:var(--ink);min-height:46px}label{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse}td{padding:10px 6px;border-bottom:2px dashed var(--ink);font-size:15px}td img{width:40px;height:40px;border-radius:12px;object-fit:cover;vertical-align:middle;border:2px solid var(--ink)}
.st{border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:700;font-size:12px;background:var(--mn);color:var(--ink)}.st.x{background:var(--bad);color:#fff}.st.w{background:var(--or);color:#2d2a4a}
.qr{width:210px;height:210px;margin:12px auto;border:4px solid var(--ink);border-radius:22px;background:#fff;padding:6px;display:grid;place-items:center;font-weight:700;color:#2d2a4a}.qr svg{width:100%;height:100%;display:block}
.ok{width:110px;height:110px;animation:boing .7s cubic-bezier(.3,1.6,.5,1) both}.ok circle{fill:var(--mn);stroke:var(--ink);stroke-width:4}.ok path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:dr .5s .35s ease-out forwards}
.party{position:fixed;left:50%;top:36%;z-index:50;pointer-events:none}.party i{position:absolute;width:13px;height:13px;border:2px solid var(--ink);animation:cf 1.5s cubic-bezier(.1,.7,.3,1) forwards}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,14px);background:var(--cd);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .3s;pointer-events:none;z-index:60;max-width:92vw}
#cbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,170%);background:var(--bl);color:#fff;border:3px solid var(--ink);border-radius:99px;box-shadow:0 5px 0 var(--ink);padding:12px 24px;font:600 16px Fredoka;cursor:pointer;z-index:20;transition:transform .4s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}#cbar.on{transform:translate(-50%,0)}
footer{border-top:3px solid var(--ink);margin-top:56px;padding:22px 0 90px;color:var(--mut);font-size:13px}footer b{font:italic 700 18px "Playfair Display",serif;color:var(--ink)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}.nk .rv{opacity:1;transform:none;transition:none}.pop{animation:pop .3s}

.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.sc2{background:var(--cd);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;animation:rise .6s both}.sc2:nth-child(2){animation-delay:.1s}.sc2:nth-child(3){animation-delay:.2s}.sc2:nth-child(4){animation-delay:.3s}
.sc2 b{display:block;font:700 30px/1.15 Fredoka,sans-serif}
.bar{height:18px;border:2.5px solid var(--ink);border-radius:99px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--or);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.sc{overflow-x:auto}.sc input[type=number]{width:76px;min-height:36px;padding:2px 8px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}.fm label{display:grid;gap:4px}.fm input[type=file]{padding:7px 10px;font-size:14px}
.sh{animation:shk .4s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes tw{50%{transform:scale(1.4) rotate(20deg);opacity:.5}}@keyframes fl{50%{transform:translateY(-8px) rotate(var(--r))}}@keyframes boing{from{transform:scale(0) rotate(-40deg)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{50%{transform:scale(1.6)}}
@keyframes cf{50%{transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{transform:translate(var(--x),calc(var(--y) + 420px)) rotate(calc(var(--r)*1.6));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.ok path{stroke-dashoffset:0}}
@media print{nav,footer,.noprint,#cbar{display:none}}

function stats(){const sold={};let rev=0,it=0,n=0;orders.filter(o=>o.st=="b").forEach(o=>{n++;o.items.forEach(([i,q])=>{sold[i]=(sold[i]||0)+q;it+=q;rev+=pr(i).p*q})});return{rev,n,it,sold,low:P.filter(p=>p.s<=5).length}}
function anim(){document.querySelectorAll(".cnt").forEach(e=>{const v=+e.dataset.v,f=x=>e.dataset.r?rp(x):x;if(rm||!v){e.textContent=f(v);return}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1100);e.textContent=f(Math.round(v*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s)})(t0)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%")))}

 if(ed){const x=pr(ed);Object.assign(x,{n,p,d});if(k){x.b=k;x.c=1}if(r){x.a=r;x.c=1}}
 else{P.push({id:Math.max(...P.map(x=>x.id))+1,n,p,d,s:Math.max(0,parseInt($("#fs").value)||0),b:k||r||PHD,a:r||k||PHD,c:1})}
 toast(ed?"Produk diperbarui ✦":"Produk ditambahkan ✦");ed=null;go("admin",1)}

function bar(){const b=$("#cbar"),n=cnt();b.classList.toggle("on",n>0&&cur!="cart");if(n)b.innerHTML=`🛒 ${n} item · ${rp(tot(Object.entries(cart).map(([i,q])=>[+i,q])))} · Checkout →`}

const V={
home(){return `<section class="hero"><span class="sp" style="left:2%;top:8%">✦</span><span class="sp" style="right:6%;top:2%;animation-delay:-1s">✦</span><span class="sp" style="left:46%;bottom:2%;animation-delay:-2s">✦</span>
<div><span class="tag">Kantin tanpa kasir</span><h1>Jajan lucu, <span class="hl">bayar jujur!</span></h1><p class="sub">Jajanan andalan kami. Sentuh fotonya, ada kejutan!</p><div class="row"><button class="btn" data-go="produk">Lihat produk</button><button class="btn o" data-go="riwayat">Riwayat</button></div></div>
<div class="pols">${P.slice(0,3).map((p,i)=>`<div class="pol" style="--r:${[-4,3,-3][i]}deg">${ph(p)}<div class="cap">${p.n}</div></div>`).join("")}</div></section>
<h2 class="c rv">Mesin vending 3D</h2><div class="ratio rv"><div class="ov" id="vl">Memuat model 3D…</div><iframe title="msfood vending machine" id="sf" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking" src="${SK}"></iframe></div>

const S=stats(),mx=Math.max(1,...P.map(p=>S.sold[p.id]||0)),f=ed===null?"":ed===0?{n:"",p:"",d:""}:pr(ed);
return `<div class="row" style="justify-content:space-between"><h1>Dasbor admin</h1><button class="btn o" data-act="logout">Keluar</button></div>
<div class="ag"><div class="sc2"><span class="mut">Pendapatan</span><b class="cnt" data-v="${S.rev}" data-r="1">0</b></div><div class="sc2"><span class="mut">Transaksi berhasil</span><b class="cnt" data-v="${S.n}">0</b></div><div class="sc2"><span class="mut">Item terjual</span><b class="cnt" data-v="${S.it}">0</b></div><div class="sc2"><span class="mut">Stok menipis</span><b class="cnt" data-v="${S.low}">0</b></div></div>
<p class="mut">Statistik sudah termasuk transaksi DEMO dan simulasi.</p>
<h2 style="margin-top:20px">Terjual per produk</h2><div class="cd">${P.map(p=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${p.n}</span><strong>${S.sold[p.id]||0}</strong></div><div class="bar"><i data-w="${Math.round((S.sold[p.id]||0)/mx*100)}"></i></div></div>`).join("")}</div>
<div class="row" style="justify-content:space-between"><h2>Stok produk</h2><button class="btn" data-act="new">＋ Tambah produk</button></div>
<div class="cd sc"><table>${P.map(p=>`<tr><td><img src="${p.b}" alt=""> ${p.n}<br><span class="mut">${rp(p.p)}</span></td><td><span class="st ${p.s==0?"x":p.s<=5?"w":""}">${p.s==0?"Habis":p.s<=5?"Menipis":"Aman"}</span> <strong>${p.s}</strong></td><td><input type="number" min="1" value="10" id="rq${p.id}" aria-label="Jumlah restock ${p.n}"> <button class="btn" data-act="restock" data-id="${p.id}">Restock</button></td><td><button class="btn o" data-act="edit" data-id="${p.id}">Edit</button></td></tr>`).join("")}</table></div>
${ed===null?"":`<div class="cd" style="margin-top:20px"><h3>${ed?"Edit produk":"Tambah produk"}</h3><div class="fm"><label>Nama<input id="fn" value="${f.n}"></label><label>Harga (Rp)<input type="number" id="fp" min="1" value="${f.p}"></label>${ed?"":`<label>Stok awal<input type="number" id="fs" min="0" value="10"></label>`}<label>Deskripsi<input id="fd" value="${f.d}"></label><label>Foto kartun (tampil awal)<input type="file" id="fk" accept="image/*"></label><label>Foto asli (saat disentuh)<input type="file" id="fr" accept="image/*"></label></div><p class="mut">Foto boleh dikosongkan. Jika hanya satu foto yang diisi, foto itu dipakai untuk keduanya.</p><div class="row"><button class="btn" data-act="savep">Simpan</button><button class="btn o" data-act="cancelp">Batal</button></div></div>`}`},
produk(){return `<h1>Produk kami</h1><p class="mut">Sentuh atau arahkan kursor ke foto, ada kejutan!</p><div class="grid">${P.map(pcard).join("")}</div>`},
cart(){if(pay)return V.pay();const it=Object.entries(cart);if(!it.length)return `<h1>Keranjang</h1><div class="cd c"><p>Keranjangmu masih kosong.</p><button class="btn" data-go="produk">Pilih produk</button></div>`;
const bad=it.some(([i,q])=>q>pr(i).s);return `<h1>Checkout</h1><div class="cd"><table>${it.map(([i,q])=>`<tr><td><img src="${pr(i).b}" alt=""> ${pr(i).n}</td><td><button class="btn o" data-d="${i},-1" aria-label="Kurangi">−</button> ${q} <button class="btn o" data-d="${i},1" aria-label="Tambah">+</button></td><td>${rp(pr(i).p*q)}</td><td><button class="btn o" data-d="${i},${-q}" aria-label="Hapus">🗑</button></td></tr>`).join("")}</table>
<h2 style="margin-top:14px">Total ${rp(tot(it.map(([i,q])=>[+i,q])))}</h2><p class="mut">Ambil produk sesuai pesanan, lalu bayar total di atas. Metode: QRIS.</p><label><input type="checkbox" id="agree"> Saya sudah/akan mengambil produk sesuai pesanan ini.</label>
<p class="mut">Konfirmasi ini bukan pengganti verifikasi pembayaran.</p>${bad?'<p class="oos">Ada produk yang melebihi stok.</p>':""}<button class="btn" id="payb" data-act="pay" disabled>Bayar sekarang</button></div>`},
pay(){const o=pay;return `<h1>Pembayaran QRIS</h1><div class="banner">SIMULASI PEMBAYARAN — TIDAK ADA UANG YANG DITRANSFER</div><div class="cd c"><div>No. pesanan <strong>${o.no}</strong></div><h2 style="margin:6px 0">${rp(tot(o.items))}</h2><span class="st ${o.st=="b"?"":o.st=="w"?"w":"x"}">${ST[o.st]}</span>
${o.st=="w"?`<div class="qr">${qr(new URL("payment-sukses.html",location.href).href)}</div><p class="mut" style="margin:0">Scan QR dengan kamera HP untuk membuka halaman Payment sukses. Ini simulasi, bukan QRIS bank.</p><p>Sisa waktu: <strong id="cd"></strong></p><div class="row c" style="margin-top:12px"><button class="btn" data-act="sim-ok">Simulasi pembayaran sukses</button><button class="btn o" data-act="gagal">Simulasi pembayaran gagal</button></div><p class="mut">Di versi produksi, status berhasil hanya berubah lewat webhook gateway yang terverifikasi.</p>`
:`${o.st=="b"?`<div><svg class="ok" viewBox="0 0 100 100" role="img" aria-label="Berhasil"><circle cx="50" cy="50" r="44"/><path d="M28 52l16 16 30-34"/></svg></div><p><strong>Yeay, pembayaran berhasil!</strong><br>Bukti transaksi tersimpan di Riwayat.</p>`:(o.st=="g"?"<p><strong>Pembayaran gagal.</strong><br>Stok tidak berkurang. Silakan coba lagi.</p>":"<p>Transaksi tidak diselesaikan.</p>")}<button class="btn" data-act="done">Lihat riwayat</button>`}</div>`},
